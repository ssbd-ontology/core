ONTOLOGY_NAME: core
ONTOLOGY_PREFIX: ssbd
ONTOLOGY_IRI: https://w3id.org/ssbd
GITHUB_REPOSITORY: ssbd-ontology/core
BUILD_DIR: build

# Optional: select subsections for the primary reference index.
# Default is "all".
# REFERENCE_SUBSECTIONS: all
# Example subset:
REFERENCE_SUBSECTIONS: all
#
# Optional: additional reference indices for `ontokit docs`.
REFERENCE_INDICES:
  - title: Properties Index
    ontology_files: 
      - build/core-squashed.ttl
    docfile: properties.rst
    # iri_regex: https://example.org/other
    imported: false
    recursive: false
    subsections: annotation_properties,object_properties,data_properties
  - title: SSbDAssessments Index
    ontology_files: 
      - ssbd-taxonomy.ttl
    docfile: ssbdtaxonomy.rst
    imported: false
    recursive: false
    subsections: classes 
  - title: Models Index
    ontology_files: 
      - models.ttl
    docfile: models.rst
    imported: false
    recursive: false
    subsections: classes
  - title: Matter Index
    ontology_file: 
      - matter.ttl
    docfile: matter.rst
    imported: false
    recursive: false
    subsections: classes
  - title: Descriptors/Indicators
    ontology_files: 
      - cheminf.ttl
      - physical-descriptors.ttl
      - biological-descriptors.ttl 
    docfile: cheminf.rst
    imported: false
    recursive: false
    subsections: classes
